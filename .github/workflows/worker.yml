name: worker

# Publica o Worker da IA gratuita (worker/) na Cloudflare e grava as chaves da Groq e do Gemini como segredos do Worker.
# Nada acontece até você cadastrar os Secrets do repositório (Settings > Secrets and variables > Actions):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, GROQ_API_KEY, GEMINI_API_KEY   (passo a passo: worker/README.md)
# Sem CLOUDFLARE_API_TOKEN o job termina sem fazer nada, em vez de falhar.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: sem segredos da Cloudflare, nada a fazer
        if: env.HAS_TOKEN != 'true'
        run: echo "Cadastre CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID nos Secrets para publicar o Worker (worker/README.md)."
      - uses: actions/checkout@v4
        if: env.HAS_TOKEN == 'true'
      - name: publicar o Worker
        if: env.HAS_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          secrets: |
            GROQ_API_KEY
            GEMINI_API_KEY
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
