# Cloudflare Worker da IA gratuita (ver worker/README.md). Sem chaves aqui: elas entram por `wrangler secret put`.
name = "ai-vj-generator-ia"
main = "vj-worker.js"
compatibility_date = "2026-01-01"

[vars]
ALLOWED_ORIGINS = "https://gyulyia3d-cloud.github.io,https://gyulyia.com,https://www.gyulyia.com"
ALLOW_FILE_ORIGIN = "false"
DAILY_LIMIT = "14"
GROQ_MODEL = "openai/gpt-oss-20b"
GEMINI_MODEL = "gemini-3.5-flash-lite"

[[durable_objects.bindings]]
name = "DAILY_BUDGET"
class_name = "DailyBudget"

[[migrations]]
tag = "daily-budget-v1"
new_sqlite_classes = ["DailyBudget"]

[[ratelimits]]
name = "RL"
namespace_id = "1001"

[ratelimits.simple]
limit = 5
period = 60
